name: Format Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    name: Check formatting with Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run format:check
