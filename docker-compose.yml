services:
  carbon-monitor:
    build: .
    container_name: carbon-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Review bundles and the OAuth refresh state live here. Backed by a named
      # volume below so a container restart does not force an operator back
      # through the browser sign-in.
      - BOB_WORKSPACE_ROOT=/workspace
      - MCP_STATE_PATH=/workspace/.mcp-state.json
      - PORT=8080
      # The OAuth redirect_uri derives from this. It must match the URL the
      # browser actually uses, or "Sign in with IBMid" fails.
      - BASE_URL=http://localhost:8080
    ports:
      # The console and API share one port, matching Code Engine, which exposes
      # a single port per app.
      - "8080:8080"
    volumes:
      - carbon-monitor-workspace:/workspace
    networks:
      - carbon-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  carbon-monitor-workspace:
    driver: local

networks:
  carbon-network:
    driver: bridge
